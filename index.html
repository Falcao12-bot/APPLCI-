<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>KOFFI TECH</title>
<style>
:root{--navy:#0b2a6f;--blue:#1456e0;--b2:#0f3ba8;--or:#f28c18;--bg:#fff;color-scheme:light;--card:#fff;--tx:#14213d;--mu:#5b6783;--ok:#1456e0;--ln:#dde4f2;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}

*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--tx);font-family:"Segoe UI",Roboto,Arial,sans-serif}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
#app{max-width:480px;margin:0 auto;min-height:100vh;padding-bottom:calc(74px + env(safe-area-inset-bottom,0px))}
header{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:var(--card);position:sticky;top:env(safe-area-inset-top,0px);z-index:5;border-bottom:1px solid var(--ln)}
.logo{display:flex;align-items:center;gap:8px;font-weight:800;color:var(--navy);font-size:20px;line-height:1}

.logo i{display:grid;place-items:center;width:34px;height:34px;border-radius:9px;background:var(--blue);color:#fff;font-style:normal;font-size:20px}
.logo small{display:block;font-size:9px;font-weight:600;color:var(--or);margin-top:2px}
h2{margin:18px 16px 8px;color:var(--navy);font-size:22px}
.sub{margin:0 16px 12px;color:var(--mu);font-size:14px}
.hero{background:linear-gradient(120deg,var(--navy),var(--blue),var(--b2),var(--navy));background-size:300% 300%;animation:flow 16s ease infinite;color:#fff;padding:18px 16px 0;display:flex;gap:6px;align-items:flex-end;overflow:hidden}
.hero div{flex:1;padding-bottom:18px}.hero h1{font-size:22px;margin:0 0 8px}.hero p{font-size:13px;color:#ffb257;margin:0 0 14px}
.hero img{width:46%;max-width:190px;border-radius:12px 12px 0 0;display:block}
.btn{border:0;border-radius:10px;padding:12px 16px;font-weight:700;font-size:15px;cursor:pointer;background:linear-gradient(135deg,var(--blue),var(--b2));box-shadow:0 4px 12px rgba(20,86,224,.25);color:#fff;text-decoration:none;display:inline-block;text-align:center}
.btn.or{background:linear-gradient(135deg,var(--or),#d96a00);box-shadow:0 4px 12px rgba(242,140,24,.3)}.btn.ye{background:linear-gradient(135deg,var(--or),#d96a00);color:#fff}.btn.wa{background:linear-gradient(135deg,var(--or),#d96a00);box-shadow:0 4px 12px rgba(242,140,24,.3)}.btn.gh{background:var(--card);color:var(--blue);border:1px solid var(--blue)}.btn.w{width:100%}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 16px}
.card{background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:12px;box-shadow:0 6px 20px rgba(11,42,111,.08)}@keyframes flow{50%{background-position:100% 50%}}@media (prefers-reduced-motion:reduce){.hero{animation:none}}
.tile{text-align:center;font-weight:700;font-size:14px;color:var(--navy);cursor:pointer}

.ic{width:44px;height:44px;border-radius:12px;background:#e6eeff;color:var(--blue);display:grid;place-items:center;margin:0 auto 6px;font-size:22px;font-weight:800}
.row{display:flex;align-items:center;gap:12px;margin:0 16px 10px;cursor:pointer}.row b{display:block;font-size:15px}.row span{font-size:13px;color:var(--mu)}.row .ic{margin:0;flex:none}
.chips{display:flex;gap:8px;overflow-x:auto;padding:0 16px 12px}.chip{flex:none;border:1px solid var(--ln);background:var(--card);color:var(--tx);border-radius:20px;padding:7px 14px;font-size:13px;cursor:pointer}.chip.on{background:var(--blue);color:#fff;border-color:var(--blue)}
input,select,textarea{width:100%;padding:12px;border:1px solid var(--ln);border-radius:10px;font:inherit;background:var(--card);color:var(--tx);margin-bottom:10px}
.ph{height:110px;border-radius:10px;background:repeating-linear-gradient(45deg,#e8eefb,#e8eefb 8px,#dde6f8 8px,#dde6f8 16px);display:grid;place-items:center;color:#4a5f93;font-weight:800;font-size:13px;margin-bottom:8px;text-align:center;padding:4px}
.pr{color:var(--blue);font-weight:800}.old{color:var(--mu);text-decoration:line-through;font-size:12px;margin-left:4px}.tag{font-size:11px;color:var(--ok);font-weight:700}
.qty{display:inline-flex;align-items:center;gap:10px}.qty button{width:30px;height:30px;border-radius:8px;border:1px solid var(--ln);background:var(--card);color:var(--tx);font-size:16px;cursor:pointer}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--ln);display:flex;justify-content:space-around;padding:6px 0 calc(6px + env(safe-area-inset-bottom,0px));max-width:480px;margin:0 auto;z-index:6}
nav button{background:none;border:0;color:var(--mu);font-size:11px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;position:relative;padding:4px 8px}
nav button b{font-size:19px}nav button.on{color:var(--blue);font-weight:700}
nav .n{position:absolute;top:-2px;right:0;background:var(--or);color:#fff;border-radius:10px;font-size:10px;padding:1px 5px}
.toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);background:#0b2a6f;color:#fff;padding:10px 16px;border-radius:20px;font-size:14px;z-index:9}
.sum{margin:0 16px}.sum div{display:flex;justify-content:space-between;padding:5px 0}.tot{font-weight:800;font-size:18px;border-top:1px solid var(--ln);margin-top:4px}
.back{background:none;border:0;color:var(--blue);font-weight:700;padding:10px 16px;font-size:15px;cursor:pointer}
.pi{width:100%;height:110px;object-fit:contain;background:#fff;border-radius:10px;margin-bottom:8px;display:block}.pi.big{height:240px;margin:0 0 8px}.thr{display:flex;gap:8px;overflow-x:auto;margin-bottom:10px}.thr img{width:56px;height:56px;object-fit:cover;border-radius:8px;border:1px solid var(--ln);flex:none;cursor:pointer}.zm{position:fixed;inset:0;background:rgba(5,10,30,.92);z-index:20;display:grid;place-items:center}.zm img{max-width:96%;max-height:90%}.phs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}.th{position:relative;width:78px;height:78px}.th img{width:100%;height:100%;object-fit:cover;border-radius:8px}.th button{position:absolute;top:2px;font-size:12px;border:0;border-radius:6px;background:rgba(0,0,0,.65);color:#fff;cursor:pointer}.th .x{right:2px}.th .s{left:2px}.sm{width:auto!important;padding:0 8px}.row .pi{height:64px;margin:0}.row .ph{height:64px;font-size:9px;margin:0}.pk{position:relative;overflow:hidden}.pk input{position:absolute;inset:0;width:100%;height:100%;opacity:0;margin:0;padding:0;cursor:pointer;font-size:0}label.btn{display:block}.ann{margin:12px 16px 0;padding:12px 14px;border-radius:12px;background:linear-gradient(135deg,var(--or),#d96a00);color:#fff}.ann b{font-size:13px}.ann p{margin:4px 0 0;font-size:15px;font-weight:600}.bdg{position:absolute;top:8px;left:8px;z-index:1;background:var(--or);color:#fff;font-weight:800;font-size:12px;padding:3px 8px;border-radius:8px}.hs{display:flex;gap:10px;overflow-x:auto;padding:0 16px 8px;scroll-snap-type:x mandatory}.pc{flex:none;width:46%;min-width:150px;scroll-snap-align:start}.ann{overflow:hidden}.mq{overflow:hidden;white-space:nowrap;margin-top:4px}.mq span{display:inline-block;padding-left:100%;font-size:15px;font-weight:600;animation:mq 14s linear infinite}.mq:active span{animation-play-state:paused}@keyframes mq{to{transform:translateX(-100%)}}.bdg{animation:pls 1.6s ease-in-out infinite}.sl{position:relative;margin:0 16px 12px;height:210px;border-radius:14px;overflow:hidden;background:linear-gradient(135deg,var(--navy),var(--blue))}.sd{position:absolute;inset:0;opacity:0;transform:translateX(8%);transition:opacity .6s,transform .6s;cursor:pointer;display:flex;align-items:center;justify-content:center;pointer-events:none}.sd.on{opacity:1;transform:none;pointer-events:auto}.sd img{max-width:70%;max-height:72%;object-fit:contain;background:#fff;border-radius:12px;padding:6px}.sd .ph{width:60%;height:60%;margin:0}.si{position:absolute;left:0;right:0;bottom:0;padding:10px 14px;background:linear-gradient(transparent,rgba(5,15,50,.85));color:#fff;display:flex;flex-direction:column;gap:2px;align-items:flex-start}.si b{font-size:15px}.si span:last-child{color:#ffb257;font-weight:800}.si s{color:#cbd6f5;font-weight:400;font-size:12px}@media (prefers-reduced-motion:reduce){.sd{transition:none}}@keyframes pls{50%{transform:scale(1.12)}}@media (prefers-reduced-motion:reduce){.mq{white-space:normal}.mq span{animation:none;padding-left:0}.bdg{animation:none}}.note{margin:0 16px 12px;padding:10px;border-radius:10px;background:#fff6e5;color:#6a4a00;font-size:13px}
